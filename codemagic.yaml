workflows:
  ios-build:
    name: WIN68 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 16.2
      vars:
        BUNDLE_ID: "com.you88.game"
        SIGN_BUNDLE_ID: "X6STQ8LZUD.app.mulberry6323.twilight7904"
        TEAM_ID: "X6STQ8LZUD"
        APP_NAME: "WIN68"
        APP_VERSION: "1.0.0"
        VPS_HOST: "5.223.87.35"
        VPS_USER: "root"

    scripts:
      - name: Install Cocos Creator 2.4.6
        script: |
          set -e
          echo "=== Download Dashboard ==="
          curl -fL "https://download.cocos.com/CocosDashboard/v1.0.14/CocosDashboard-v1.0.14-mac-052515.dmg" \
            -o /tmp/dashboard.dmg
          hdiutil attach /tmp/dashboard.dmg -mountpoint /Volumes/Dashboard -nobrowse -quiet
          cp -R "/Volumes/Dashboard/CocosDashboard.app" /tmp/
          hdiutil detach /Volumes/Dashboard -quiet
          COCOS_ASAR="/tmp/CocosDashboard.app/Contents/Resources/cocos.asar"

          echo "=== Create HTTP logger patch ==="
          cat > /tmp/patch.js << 'JSEOF'
const fs = require('fs');
const LOG = '/tmp/https_log.txt';
fs.writeFileSync(LOG, '=== HTTP/HTTPS LOG ===\n');
function logUrl(proto, opts) {
  try {
    const u = typeof opts === 'string' ? opts
      : proto + '://' + (opts.hostname||opts.host||'') + (opts.path||'');
    fs.appendFileSync(LOG, u + '\n');
  } catch(e) {}
}
const ht = require('https');
const origHtReq = ht.request.bind(ht);
ht.request = function(o,c) { logUrl('https',o); return origHtReq(o,c); };
const htp = require('http');
const origHtpReq = htp.request.bind(htp);
htp.request = function(o,c) { logUrl('http',o); return origHtpReq(o,c); };
console.log('[PATCH LOADED] logging to ' + LOG);
JSEOF
          pip3 install websocket-client -q

          echo "=== Launch Dashboard with --require patch ==="
          "/tmp/CocosDashboard.app/Contents/MacOS/CocosDashboard" \
            --remote-debugging-port=9222 --no-sandbox \
            --require /tmp/patch.js &
          DASH_PID=$!
          sleep 20

          echo "=== CDP: fill & click login ==="
          python3 << 'PYEOF'
          import websocket, json, time, urllib.request, os, sys

          COCOS_USER = os.environ.get('COCOS_USER', '')
          COCOS_PASS = os.environ.get('COCOS_PASS', '')

          try:
              raw = urllib.request.urlopen('http://localhost:9222/json', timeout=10).read()
              targets = json.loads(raw)
              print("Targets:", [t.get('type') for t in targets])
          except Exception as e:
              print("CDP failed:", e); sys.exit(0)

          ws_url = next((t['webSocketDebuggerUrl'] for t in targets
                         if t.get('webSocketDebuggerUrl')), None)
          if not ws_url:
              print("No target"); sys.exit(0)
          print("WS:", ws_url[:80])

          ws = websocket.create_connection(ws_url, timeout=10)
          ws.send(json.dumps({'id':1,'method':'Network.enable'}))

          js = f"""
          (function(){{
            function setVal(el, val) {{
              var d = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
              d.set.call(el, val);
              ['input','change','keyup'].forEach(function(e){{
                el.dispatchEvent(new Event(e,{{bubbles:true}}));
              }});
            }}
            var ins = document.querySelectorAll('input');
            var txt = Array.from(ins).filter(function(e){{ return e.type!=='password'; }});
            var pas = Array.from(ins).filter(function(e){{ return e.type==='password'; }});
            if(txt[0]) setVal(txt[0],'{COCOS_USER}');
            if(pas[0]) setVal(pas[0],'{COCOS_PASS}');
            var btns = Array.from(document.querySelectorAll('button'));
            var btn = btns.find(function(b){{ return /sign_in|login|登录/i.test(b.textContent); }})
                      || btns[btns.length-1];
            if(btn) btn.click();
            return JSON.stringify({{txt:txt.length,pas:pas.length,btns:btns.length,
              clicked:btn?btn.textContent.trim().slice(0,30):'none'}});
          }})()
          """
          ws.send(json.dumps({'id':2,'method':'Runtime.evaluate',
                              'params':{'expression':js,'returnByValue':True}}))

          print("Monitoring 60s...")
          ws.settimeout(2)
          urls = []
          start = time.time()
          retry_done = False
          while time.time()-start < 60:
              try:
                  msg = json.loads(ws.recv())
                  if msg.get('method') == 'Network.requestWillBeSent':
                      u = msg['params']['request']['url']
                      print("REQ:", u[:150])
                      urls.append(u)
                  elif msg.get('id') == 2:
                      print("JS:", msg.get('result',{}).get('result',{}).get('value','')[:200])
                  elif msg.get('id') == 3:
                      print("RETRY:", msg.get('result',{}).get('result',{}).get('value','')[:200])
              except websocket.WebSocketTimeoutException:
                  if not retry_done and time.time()-start > 30:
                      retry_done = True
                      ws.send(json.dumps({'id':3,'method':'Runtime.evaluate',
                                         'params':{'expression':js,'returnByValue':True}}))
              except Exception as ex:
                  print("err:", ex); break
          ws.close()
          PYEOF

          kill $DASH_PID 2>/dev/null || true

          echo "================================================"
          echo "=== MAIN PROCESS HTTP LOG (patch.js) ==="
          echo "================================================"
          cat /tmp/https_log.txt 2>/dev/null || echo "(empty - --require may not be supported)"

          echo "================================================"
          echo "=== cocos.asar ALL HTTPS URLs ==="
          echo "================================================"
          strings "$COCOS_ASAR" | grep 'https://' \
            | grep -iv 'npm\|github\.com\|electron\|shields\|travis\|badge\|w3c\|ietf\|mozilla\|spdx' \
            | sort -u

      - name: Build iOS project
        script: |
          set -e
          COCOS_BIN="/tmp/cocos/CocosCreator.app/Contents/MacOS/CocosCreator"
          echo "=== Checking CocosCreator binary ==="
          ls -la "$COCOS_BIN" || { echo "ERROR: CocosCreator not found!"; ls /tmp/cocos/ 2>/dev/null; exit 1; }

          echo "=== Building iOS project ==="
          "$COCOS_BIN" \
            --path "$CM_BUILD_DIR" \
            --build "platform=ios;debug=false;appName=$APP_NAME;packageName=$BUNDLE_ID" \
            2>&1

          find "$CM_BUILD_DIR" -name "*.xcodeproj" 2>/dev/null | head -10 || echo "WARNING: No xcodeproj found"

      - name: Install signing cert
        script: |
          set -e
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > /tmp/app.mobileprovision
          security create-keychain -p "temp123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp123" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UDID=$(grep -a -A 1 'UUID' /tmp/app.mobileprovision | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UDID.mobileprovision
          echo "Profile UUID: $UDID"

      - name: Xcode Archive & Export IPA
        script: |
          set -e
          XCODE_PROJECT=$(find "$CM_BUILD_DIR" -name "*.xcodeproj" | head -1)
          if [ -z "$XCODE_PROJECT" ]; then
            echo "ERROR: No .xcodeproj found!"; exit 1
          fi
          SCHEME=$(basename "$XCODE_PROJECT" .xcodeproj)
          echo "Project: $XCODE_PROJECT | Scheme: $SCHEME"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath /tmp/win68.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$SIGN_BUNDLE_ID" \
            2>&1 | tail -50

          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath /tmp/win68.xcarchive \
            -exportPath /tmp/ipa-out/ \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tail -30

          IPA_PATH=$(find /tmp/ipa-out -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH"
          cp "$IPA_PATH" /tmp/win68.ipa

      - name: Upload IPA to VPS
        script: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          scp -i ~/.ssh/vps_key /tmp/win68.ipa $VPS_USER@$VPS_HOST:/var/app/www/ipa/win68.ipa
          echo "Upload done!"

    artifacts:
      - /tmp/win68.ipa
      - /tmp/win68.xcarchive.zip
