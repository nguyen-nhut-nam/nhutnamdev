workflows:

  # ============================================================
  # WORKFLOW A: Cocos Creator build -> upload jsb-link to VPS
  # Runs ONCE (or when game assets change). ~100 min, fits in 120.
  # ============================================================
  creator-build:
    name: A - Creator Build (jsb-link)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.you88.game"
        APP_NAME: "WIN68"
        VPS_HOST: "5.223.87.35"
        VPS_USER: "root"
    scripts:
      - name: Download Cocos Creator 2.4.9
        script: |
          set -e
          CREATOR_BIN="/tmp/cocos/CocosCreator.app/Contents/MacOS/CocosCreator"
          curl -fL "https://download.cocos.com/CocosCreator/v2.4.9/CocosCreator_v2.4.9_20220412_mac.zip" \
            -o /tmp/creator.zip --progress-bar --retry 3
          mkdir -p /tmp/cocos
          unzip -q /tmp/creator.zip -d /tmp/cocos
          chmod +x "$CREATOR_BIN"
          echo "Creator ready"

      - name: Download + extract library cache
        script: |
          set -e
          mkdir -p ~/.CocosCreator
          printf '%s' '{"language":"en","simulator-customsize-resolution":{"width":960,"height":640}}' > ~/.CocosCreator/settings.json
          curl -fL "https://win68.ltd/ipa/creator-library.tar.gz" -o /tmp/lib.tar.gz --retry 3 --progress-bar
          tar -xzf /tmp/lib.tar.gz -C "$CM_BUILD_DIR"
          echo "Imports: $(find $CM_BUILD_DIR/library/imports -type f 2>/dev/null | wc -l)"

      - name: Generate uuid-to-mtime + local config
        script: |
          set -e
          echo "" | base64 --decode | python3
          mkdir -p "$CM_BUILD_DIR/local"
          printf '%s' '{}' > "$CM_BUILD_DIR/local/settings.json"
          printf '%s' '{"platform":"ios","debug":false}' > "$CM_BUILD_DIR/local/builder.json"

      - name: Run Creator build (jsb-link)
        script: |
          set -e
          CREATOR_BIN="/tmp/cocos/CocosCreator.app/Contents/MacOS/CocosCreator"
          (while true; do
            imp=$(find "$CM_BUILD_DIR/library/imports" -type f 2>/dev/null | wc -l)
            xc=$(find "$CM_BUILD_DIR/build" -name "*.xcodeproj" 2>/dev/null | wc -l)
            bsz=$(du -sh "$CM_BUILD_DIR/build" 2>/dev/null | cut -f1)
            echo "[$(date +%H:%M:%S)] imports=$imp xcodeproj=$xc build_size=$bsz"
            sleep 30
          done) &
          MON=$!
          "$CREATOR_BIN" \
            --path "$CM_BUILD_DIR" \
            --build "platform=ios;debug=false;appName=$APP_NAME;packageName=$BUNDLE_ID" \
            --quit 2>&1
          kill $MON 2>/dev/null || true
          echo "=== Creator build finished ==="
          find "$CM_BUILD_DIR/build" -name "*.xcodeproj" | head -5 || { echo "ERROR no xcodeproj"; exit 1; }

      - name: Package + upload jsb-link to VPS
        script: |
          set -e
          cd "$CM_BUILD_DIR/build"
          BUILD_SUBDIR=$(ls -d */ | head -1)
          echo "Packing $BUILD_SUBDIR ..."
          tar -czf /tmp/jsb-link.tar.gz -C "$CM_BUILD_DIR/build" .
          echo "Archive: $(du -sh /tmp/jsb-link.tar.gz | cut -f1)"
          brew install hudochenkov/sshpass/sshpass 2>/dev/null || true
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -p "AHVwAEPLtEcf" scp -o StrictHostKeyChecking=no \
            /tmp/jsb-link.tar.gz "$VPS_USER@$VPS_HOST:/var/app/www/ipa/jsb-link.tar.gz"
          echo "=== jsb-link uploaded. Now run workflow B (xcode-ipa) ==="
    artifacts:
      - /tmp/jsb-link.tar.gz

  # ============================================================
  # WORKFLOW B: download jsb-link -> xcodebuild -> IPA -> VPS
  # Runs each release. ~25 min. No Cocos Creator needed.
  # ============================================================
  xcode-ipa:
    name: B - Xcode Archive -> IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
      vars:
        SIGN_BUNDLE_ID: "X6STQ8LZUD.app.mulberry6323.twilight7904"
        TEAM_ID: "X6STQ8LZUD"
        VPS_HOST: "5.223.87.35"
        VPS_USER: "root"
    scripts:
      - name: Download jsb-link from VPS
        script: |
          set -e
          curl -fL "https://win68.ltd/ipa/jsb-link.tar.gz" -o /tmp/jsb-link.tar.gz --retry 3 --progress-bar
          mkdir -p "$CM_BUILD_DIR/build"
          tar -xzf /tmp/jsb-link.tar.gz -C "$CM_BUILD_DIR/build"
          echo "Extracted:"
          find "$CM_BUILD_DIR/build" -name "*.xcodeproj" | head -5

      - name: Install signing cert
        script: |
          set -e
          curl -fL "https://win68.ltd/ipa/cert.p12" -o /tmp/cert.p12 --retry 3
          curl -fL "https://win68.ltd/ipa/cert.mobileprovision" -o /tmp/app.mobileprovision --retry 3
          security delete-keychain build.keychain 2>/dev/null || true
          security create-keychain -p "temp123" build.keychain
          security set-keychain-settings -lut 7200 build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security import /tmp/cert.p12 -k build.keychain -P "xincamon" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp123" build.keychain
          security find-identity -v -p codesigning build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UDID=$(grep -a -A 1 'UUID' /tmp/app.mobileprovision | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UDID.mobileprovision

      - name: Xcode archive + export IPA
        script: |
          set -e
          XCODE_PROJECT=$(find "$CM_BUILD_DIR/build" -name "*.xcodeproj" | head -1)
          [ -z "$XCODE_PROJECT" ] && { echo "ERROR no xcodeproj"; exit 1; }
          SCHEME=$(basename "$XCODE_PROJECT" .xcodeproj)
          echo "Project: $XCODE_PROJECT | Scheme: $SCHEME"
          xcodebuild archive \
            -project "$XCODE_PROJECT" -scheme "$SCHEME" -configuration Release \
            -archivePath /tmp/win68.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$SIGN_BUNDLE_ID" 2>&1 | tail -60
          python3 -c "import plistlib; plistlib.dump({'method':'ad-hoc','signingStyle':'manual','stripSwiftSymbols':True,'compileBitcode':False}, open('/tmp/ExportOptions.plist','wb'))"
          xcodebuild -exportArchive -archivePath /tmp/win68.xcarchive \
            -exportPath /tmp/ipa-out/ -exportOptionsPlist /tmp/ExportOptions.plist 2>&1 | tail -30
          IPA=$(find /tmp/ipa-out -name "*.ipa" | head -1)
          echo "IPA: $IPA ($(du -sh $IPA | cut -f1))"
          cp "$IPA" /tmp/win68.ipa

      - name: Upload IPA to VPS
        script: |
          set -e
          brew install hudochenkov/sshpass/sshpass 2>/dev/null || true
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -p "AHVwAEPLtEcf" scp -o StrictHostKeyChecking=no \
            /tmp/win68.ipa "$VPS_USER@$VPS_HOST:/var/app/www/ipa/win68.ipa"
          echo "=== DONE: https://win68.ltd/ipa/ ==="
    artifacts:
      - /tmp/win68.ipa
