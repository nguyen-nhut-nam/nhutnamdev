workflows:
  ios-build:
    name: WIN68 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 16.2
      vars:
        BUNDLE_ID: "com.you88.game"
        SIGN_BUNDLE_ID: "X6STQ8LZUD.app.mulberry6323.twilight7904"
        TEAM_ID: "X6STQ8LZUD"
        APP_NAME: "WIN68"
        APP_VERSION: "1.0.0"
        VPS_HOST: "5.223.87.35"
        VPS_USER: "root"

    scripts:
      - name: Install Cocos Creator 2.4.6
        script: |
          set -e
          CREATOR_ZIP="https://download.cocos.com/CocosCreator/v2.4.9/CocosCreator_v2.4.9_20220412_mac.zip"
          CREATOR_DIR="/tmp/cocos"
          CREATOR_BIN="$CREATOR_DIR/CocosCreator.app/Contents/MacOS/CocosCreator"

          echo "=== Download Creator 2.4.6 Mac (620MB) ==="
          curl -fL "$CREATOR_ZIP" -o /tmp/creator.zip --progress-bar
          echo "Download done: $(du -sh /tmp/creator.zip | cut -f1)"

          echo "=== Extract Creator ==="
          mkdir -p "$CREATOR_DIR"
          unzip -q /tmp/creator.zip -d "$CREATOR_DIR"
          ls "$CREATOR_DIR"

          echo "=== Verify ==="
          ls -la "$CREATOR_BIN" || { echo "ERROR: binary not found"; find "$CREATOR_DIR" -name "CocosCreator" -type f; exit 1; }
          chmod +x "$CREATOR_BIN"
          echo "Creator 2.4.6 ready!"

      - name: Build iOS project
        script: |
          set -e
          CREATOR_BIN="/tmp/cocos/CocosCreator.app/Contents/MacOS/CocosCreator"

          echo "=== Pre-setup Creator settings ==="
          mkdir -p ~/.CocosCreator
          printf '%s' '{"language":"en","simulator-customsize-resolution":{"width":960,"height":640}}' > ~/.CocosCreator/settings.json

          echo "=== Download pre-built Creator library from VPS ==="
          brew install hudochenkov/sshpass/sshpass 2>/dev/null || true
          curl -f --retry 3 --retry-delay 5 \
            "https://win68.ltd/ipa/creator-library.tar.gz" \
            -o /tmp/creator-library.tar.gz --progress-bar || {
            # Fallback: scp from VPS
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            sshpass -p "AHVwAEPLtEcf" scp -o StrictHostKeyChecking=no \
              "$VPS_USER@$VPS_HOST:/var/app/www/ipa/creator-library.tar.gz" /tmp/creator-library.tar.gz
          }
          echo "Library archive: $(du -sh /tmp/creator-library.tar.gz | cut -f1)"

          echo "=== Extract library ==="
          mkdir -p "$CM_BUILD_DIR/library"
          tar -xzf /tmp/creator-library.tar.gz -C "$CM_BUILD_DIR/library"
          echo "Extracted: $(ls $CM_BUILD_DIR/library/)"
          echo "Imports count: $(find $CM_BUILD_DIR/library/imports -type f 2>/dev/null | wc -l)"

          echo "=== Generate uuid-to-mtime.json matching CI file mtimes ==="
          python3 - <<'PYEOF'
import json, os, re

project = os.environ.get('CM_BUILD_DIR', '.')
assets_dir = os.path.join(project, 'assets')
output = os.path.join(project, 'library', 'uuid-to-mtime.json')

uuid_map = {}
UUID_RE = re.compile(r'"uuid"\s*:\s*"([0-9a-f\-]{36})"')

for root, dirs, files in os.walk(assets_dir):
    for fname in files:
        if not fname.endswith('.meta'):
            continue
        meta_path = os.path.join(root, fname)
        asset_path = meta_path[:-5]
        try:
            content = open(meta_path, encoding='utf-8', errors='ignore').read()
            m = UUID_RE.search(content)
            if not m:
                continue
            uuid = m.group(1)
            meta_mtime = int(os.path.getmtime(meta_path) * 1000)
            asset_mtime = int(os.path.getmtime(asset_path) * 1000) if os.path.exists(asset_path) else meta_mtime
            rel = os.path.relpath(asset_path, assets_dir)
            uuid_map[uuid] = {'asset': asset_mtime, 'meta': meta_mtime, 'relativePath': rel}
        except Exception as e:
            pass

with open(output, 'w', encoding='utf-8') as f:
    json.dump(uuid_map, f)
print(f'Generated uuid-to-mtime.json: {len(uuid_map)} entries')
PYEOF

          echo "=== Pre-create project local/ files ==="
          mkdir -p "$CM_BUILD_DIR/local"
          printf '%s' '{}' > "$CM_BUILD_DIR/local/settings.json"
          printf '%s' '{"platform":"ios","debug":false}' > "$CM_BUILD_DIR/local/builder.json"

          echo "=== Run Creator (imports should be skipped via cache) ==="
          (while true; do
            count=$(find "$CM_BUILD_DIR/library/imports" -type f 2>/dev/null | wc -l)
            echo "[MONITOR $(date +%H:%M:%S)] import_files=$count"
            sleep 30
          done) &
          MONITOR_PID=$!

          "$CREATOR_BIN" \
            --path "$CM_BUILD_DIR" \
            --build "platform=ios;debug=false;appName=$APP_NAME;packageName=$BUNDLE_ID" \
            --quit \
            2>&1

          kill $MONITOR_PID 2>/dev/null || true
          echo "=== Xcode project ==="
          find "$CM_BUILD_DIR/build" -name "*.xcodeproj" 2>/dev/null | head -5 || { echo "ERROR: No xcodeproj"; exit 1; }

          echo "=== Xcode project ==="
          find "$CM_BUILD_DIR" -name "*.xcodeproj" 2>/dev/null | head -5 || { echo "ERROR: No xcodeproj found"; exit 1; }

      - name: Install signing cert
        script: |
          set -e
          echo "=== Download cert from VPS ==="
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -p "AHVwAEPLtEcf" scp -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:/var/app/www/ipa/cert.p12" /tmp/cert.p12
          sshpass -p "AHVwAEPLtEcf" scp -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:/var/app/www/ipa/cert.mobileprovision" /tmp/app.mobileprovision
          echo "cert.p12: $(wc -c < /tmp/cert.p12) bytes"
          echo "mobileprovision: $(wc -c < /tmp/app.mobileprovision) bytes"

          echo "=== Create keychain ==="
          security delete-keychain build.keychain 2>/dev/null || true
          security create-keychain -p "temp123" build.keychain
          security set-keychain-settings -lut 7200 build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          echo "=== Import certificate ==="
          security import /tmp/cert.p12 -k build.keychain -P "xincamon" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp123" build.keychain
          security find-identity -v -p codesigning build.keychain

          echo "=== Install provisioning profile ==="
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UDID=$(grep -a -A 1 'UUID' /tmp/app.mobileprovision | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UDID.mobileprovision
          echo "Profile UUID: $UDID"

      - name: Xcode Archive & Export IPA
        script: |
          set -e
          XCODE_PROJECT=$(find "$CM_BUILD_DIR" -name "*.xcodeproj" | head -1)
          if [ -z "$XCODE_PROJECT" ]; then
            echo "ERROR: No .xcodeproj found!"; exit 1
          fi
          SCHEME=$(basename "$XCODE_PROJECT" .xcodeproj)
          echo "Project: $XCODE_PROJECT | Scheme: $SCHEME"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath /tmp/win68.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$SIGN_BUNDLE_ID" \
            2>&1 | tail -50

          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath /tmp/win68.xcarchive \
            -exportPath /tmp/ipa-out/ \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tail -30

          IPA_PATH=$(find /tmp/ipa-out -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH"
          cp "$IPA_PATH" /tmp/win68.ipa

      - name: Upload IPA to VPS
        script: |
          set -e
          apt-get install -y sshpass 2>/dev/null || brew install hudochenkov/sshpass/sshpass 2>/dev/null || true
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -p "AHVwAEPLtEcf" scp -o StrictHostKeyChecking=no \
            /tmp/win68.ipa $VPS_USER@$VPS_HOST:/var/app/www/ipa/win68.ipa
          echo "Upload done!"

    artifacts:
      - /tmp/win68.ipa
      - /tmp/win68.xcarchive.zip
