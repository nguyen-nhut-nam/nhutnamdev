workflows:
  ios-build:
    name: WIN68 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 16.2
      vars:
        BUNDLE_ID: "com.you88.game"
        SIGN_BUNDLE_ID: "X6STQ8LZUD.app.mulberry6323.twilight7904"
        TEAM_ID: "X6STQ8LZUD"
        APP_NAME: "WIN68"
        APP_VERSION: "1.0.0"
        VPS_HOST: "5.223.87.35"
        VPS_USER: "root"

    scripts:
      - name: Install Cocos Creator 2.4.6
        script: |
          set -e
          echo "=== Download & mount Dashboard ==="
          curl -fL "https://download.cocos.com/CocosDashboard/v1.0.14/CocosDashboard-v1.0.14-mac-052515.dmg" \
            -o /tmp/dashboard.dmg
          hdiutil attach /tmp/dashboard.dmg -mountpoint /Volumes/Dashboard -nobrowse -quiet
          cp -R "/Volumes/Dashboard/CocosDashboard.app" /tmp/
          hdiutil detach /Volumes/Dashboard -quiet

          echo "=== Launch Dashboard with CDP port ==="
          "/tmp/CocosDashboard.app/Contents/MacOS/CocosDashboard" \
            --remote-debugging-port=9222 --no-sandbox &
          DASH_PID=$!
          sleep 20

          echo "=== CDP targets ==="
          curl -s http://localhost:9222/json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for t in data:
              print(t.get('type'), t.get('url'), t.get('webSocketDebuggerUrl','')[:80])
          " || true

          echo "=== Install websocket-client ==="
          pip3 install websocket-client -q

          echo "=== CDP login + capture network ==="
          python3 << 'PYEOF'
          import websocket, json, time, urllib.request, os, sys

          COCOS_USER = os.environ.get('COCOS_USER', '')
          COCOS_PASS = os.environ.get('COCOS_PASS', '')

          try:
              raw = urllib.request.urlopen('http://localhost:9222/json', timeout=10).read()
              targets = json.loads(raw)
              print("Targets:", [t.get('type') for t in targets])
          except Exception as e:
              print("CDP connect failed:", e); sys.exit(1)

          ws_url = next((t['webSocketDebuggerUrl'] for t in targets
                         if t.get('webSocketDebuggerUrl')), None)
          if not ws_url:
              print("No debuggable target"); sys.exit(1)
          print("WS:", ws_url[:80])

          ws = websocket.create_connection(ws_url, timeout=10)
          ws.send(json.dumps({'id':1,'method':'Network.enable'}))

          # JS: dump ALL elements + try to find & fill login form
          js = f"""
          (function(){{
            var result = {{}};
            var inputs = document.querySelectorAll('input');
            result.inputs = Array.from(inputs).map(function(el){{
              return el.type+'|'+el.name+'|'+el.placeholder+'|'+el.className.slice(0,40);
            }});
            var allBtns = document.querySelectorAll('button, [class*=btn], [class*=login], a[href*=login]');
            result.btns = Array.from(allBtns).map(function(b){{
              return b.tagName+'|'+b.className.slice(0,40)+'|'+b.textContent.trim().slice(0,30);
            }});
            result.title = document.title;
            result.url = location.href;
            result.bodyText = document.body ? document.body.innerText.slice(0,300) : '';

            // Try fill inputs
            var textIn = Array.from(inputs).filter(function(el){{
              return el.type==='text'||el.type==='email'||el.type===''||el.type==='tel';
            }});
            var passIn = Array.from(inputs).filter(function(el){{ return el.type==='password'; }});
            if(textIn[0]){{ textIn[0].value='{COCOS_USER}'; textIn[0].dispatchEvent(new Event('input',{{bubbles:true}})); textIn[0].dispatchEvent(new Event('change',{{bubbles:true}})); }}
            if(passIn[0]){{ passIn[0].value='{COCOS_PASS}'; passIn[0].dispatchEvent(new Event('input',{{bubbles:true}})); passIn[0].dispatchEvent(new Event('change',{{bubbles:true}})); }}

            // Try click: login button or submit or last button
            var clicked = false;
            for(var i=0;i<allBtns.length;i++){{
              var t=allBtns[i].textContent.trim();
              if(/login|sign|submit|登录|登入|确认|确定|进入/i.test(t)){{
                allBtns[i].click(); result.clicked=t; clicked=true; break;
              }}
            }}
            if(!clicked && allBtns.length>0){{
              allBtns[allBtns.length-1].click();
              result.clicked='last:'+allBtns[allBtns.length-1].textContent.trim().slice(0,20);
            }}
            if(!clicked && inputs.length>0){{
              var form = inputs[0].closest('form');
              if(form){{ form.submit(); result.clicked='form.submit'; }}
            }}
            return JSON.stringify(result);
          }})()
          """
          ws.send(json.dumps({'id':2,'method':'Runtime.evaluate','params':{'expression':js,'returnByValue':True}}))

          urls = []
          print("Monitoring network for 60s...")
          ws.settimeout(2)
          start = time.time()
          phase2_done = False
          while time.time()-start < 60:
              try:
                  msg = json.loads(ws.recv())
                  m = msg.get('method','')
                  if m == 'Network.requestWillBeSent':
                      url = msg['params']['request']['url']
                      print("REQ:", url[:150])
                      urls.append(url)
                  elif msg.get('id') == 2:
                      val = msg.get('result',{}).get('result',{}).get('value','')
                      print("JS dump:", val[:500])
                      # After 30s retry JS once more
                  elif msg.get('id') == 3:
                      val = msg.get('result',{}).get('result',{}).get('value','')
                      print("JS retry:", val[:500])
              except websocket.WebSocketTimeoutException:
                  elapsed = time.time()-start
                  if not phase2_done and elapsed > 30:
                      phase2_done = True
                      print("=== 30s: retry JS ===")
                      ws.send(json.dumps({'id':3,'method':'Runtime.evaluate','params':{'expression':js,'returnByValue':True}}))
              except Exception as e:
                  print("err:", e); break
          ws.close()

          # Save to file
          with open('/tmp/cocos_urls.txt','w') as f:
              f.write('\n'.join(urls))
          print("\n=== All URLs ===")
          for u in urls: print(u)
          PYEOF

          echo "=== Upload captured URLs to VPS ==="
          printf '%b\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key || echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/vps_key /tmp/cocos_urls.txt $VPS_USER@$VPS_HOST:/var/app/www/ipa/cocos_urls.txt 2>&1 || true

          echo "=== Cocos dirs after CDP ==="
          find "$HOME/Library/Application Support/Cocos" -maxdepth 3 2>/dev/null | head -30 || true
          kill $DASH_PID 2>/dev/null || true

      - name: Build iOS project
        script: |
          set -e
          COCOS_BIN="/tmp/cocos/CocosCreator.app/Contents/MacOS/CocosCreator"
          echo "=== Checking CocosCreator binary ==="
          ls -la "$COCOS_BIN" || { echo "ERROR: CocosCreator not found!"; ls /tmp/cocos/; exit 1; }

          echo "=== Building iOS project ==="
          "$COCOS_BIN" \
            --path "$CM_BUILD_DIR" \
            --build "platform=ios;debug=false;appName=$APP_NAME;packageName=$BUNDLE_ID" \
            2>&1

          echo "=== Build complete, searching for xcodeproj ==="
          find "$CM_BUILD_DIR" -name "*.xcodeproj" 2>/dev/null | head -10 || echo "WARNING: No xcodeproj found"
          ls "$CM_BUILD_DIR/build/" 2>/dev/null || echo "No build/ directory"

      - name: Install signing cert
        script: |
          set -e
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > /tmp/app.mobileprovision
          security create-keychain -p "temp123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp123" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UDID=$(grep -a -A 1 'UUID' /tmp/app.mobileprovision | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UDID.mobileprovision
          echo "Profile UUID: $UDID"

      - name: Xcode Archive & Export IPA
        script: |
          set -e
          echo "=== Searching for Xcode project ==="
          find "$CM_BUILD_DIR" -name "*.xcodeproj" 2>/dev/null

          XCODE_PROJECT=$(find "$CM_BUILD_DIR" -name "*.xcodeproj" | head -1)
          if [ -z "$XCODE_PROJECT" ]; then
            echo "ERROR: No .xcodeproj found!"
            find "$CM_BUILD_DIR/build" -type f 2>/dev/null | head -30
            exit 1
          fi

          SCHEME=$(basename "$XCODE_PROJECT" .xcodeproj)
          echo "Project: $XCODE_PROJECT | Scheme: $SCHEME"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath /tmp/win68.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$SIGN_BUNDLE_ID" \
            2>&1 | tail -50

          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath /tmp/win68.xcarchive \
            -exportPath /tmp/ipa-out/ \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tail -30

          IPA_PATH=$(find /tmp/ipa-out -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH"
          cp "$IPA_PATH" /tmp/win68.ipa

      - name: Upload IPA to VPS
        script: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          scp -i ~/.ssh/vps_key /tmp/win68.ipa $VPS_USER@$VPS_HOST:/var/app/www/ipa/win68.ipa
          echo "Upload done!"

    artifacts:
      - /tmp/win68.ipa
      - /tmp/win68.xcarchive.zip
