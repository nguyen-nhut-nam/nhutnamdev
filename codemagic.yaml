workflows:
  ios-build:
    name: WIN68 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 16.2
      vars:
        BUNDLE_ID: "com.you88.game"
        SIGN_BUNDLE_ID: "X6STQ8LZUD.app.mulberry6323.twilight7904"
        TEAM_ID: "X6STQ8LZUD"
        APP_NAME: "WIN68"
        APP_VERSION: "1.0.0"
        VPS_HOST: "5.223.87.35"
        VPS_USER: "root"

    scripts:
      - name: Install Cocos Creator 2.4.6
        script: |
          set -e
          echo "=== Mount Dashboard (already cached) ==="
          curl -fL "https://download.cocos.com/CocosDashboard/v1.0.14/CocosDashboard-v1.0.14-mac-052515.dmg" \
            -o /tmp/dashboard.dmg
          hdiutil attach /tmp/dashboard.dmg -mountpoint /Volumes/Dashboard -nobrowse -quiet
          cp -R "/Volumes/Dashboard/CocosDashboard.app" /tmp/
          hdiutil detach /Volumes/Dashboard -quiet

          ASAR="/tmp/CocosDashboard.app/Contents/Resources/app.asar"

          echo "=== All download.cocos.com URLs in ASAR ==="
          strings "$ASAR" | grep "download.cocos.com" | sort -u

          echo "=== All darwin platform entries ==="
          strings "$ASAR" | grep '"darwin"' | sort -u | head -30

          echo "=== Creator-related URLs ==="
          strings "$ASAR" | grep -i "creator\|Creator" | grep "http\|url\|\.zip\|\.asar\|download" | sort -u | head -30

          echo "=== Broader context: lines containing download.cocos.com ==="
          strings "$ASAR" | grep -B2 -A2 "download.cocos.com" 2>/dev/null | head -60 || true

          echo "=== Probe URL variants ==="
          for URL in \
            "https://download.cocos.com/Cocos3D/test/cocos_test.asar" \
            "https://download.cocos.com/CocosCreator2/v2.4.6/darwin.asar" \
            "https://download.cocos.com/CocosCreator2/v2.4.6/mac.zip" \
            "https://download.cocos.com/CocosCreator/v2.4.6/mac.asar" \
            "https://download.cocos.com/CocosCreator/v2.4.6/darwin.asar"
          do
            STATUS=$(curl -sIo /dev/null -w "%{http_code}" --max-time 5 "$URL" 2>/dev/null)
            echo "HTTP $STATUS : $URL"
          done

          echo "=== DONE ==="
          exit 1

      - name: Build iOS project
        script: |
          set -e
          COCOS_BIN="/tmp/cocos/CocosCreator.app/Contents/MacOS/CocosCreator"
          echo "=== Checking CocosCreator binary ==="
          ls -la "$COCOS_BIN" || { echo "ERROR: CocosCreator not found!"; ls /tmp/cocos/; exit 1; }

          echo "=== Building iOS project ==="
          "$COCOS_BIN" \
            --path "$CM_BUILD_DIR" \
            --build "platform=ios;debug=false;appName=$APP_NAME;packageName=$BUNDLE_ID" \
            2>&1

          echo "=== Build complete, searching for xcodeproj ==="
          find "$CM_BUILD_DIR" -name "*.xcodeproj" 2>/dev/null | head -10 || echo "WARNING: No xcodeproj found"
          ls "$CM_BUILD_DIR/build/" 2>/dev/null || echo "No build/ directory"

      - name: Install signing cert
        script: |
          set -e
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > /tmp/app.mobileprovision
          security create-keychain -p "temp123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp123" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UDID=$(grep -a -A 1 'UUID' /tmp/app.mobileprovision | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UDID.mobileprovision
          echo "Profile UUID: $UDID"

      - name: Xcode Archive & Export IPA
        script: |
          set -e
          echo "=== Searching for Xcode project ==="
          find "$CM_BUILD_DIR" -name "*.xcodeproj" 2>/dev/null

          XCODE_PROJECT=$(find "$CM_BUILD_DIR" -name "*.xcodeproj" | head -1)
          if [ -z "$XCODE_PROJECT" ]; then
            echo "ERROR: No .xcodeproj found!"
            find "$CM_BUILD_DIR/build" -type f 2>/dev/null | head -30
            exit 1
          fi

          SCHEME=$(basename "$XCODE_PROJECT" .xcodeproj)
          echo "Project: $XCODE_PROJECT | Scheme: $SCHEME"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath /tmp/win68.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$SIGN_BUNDLE_ID" \
            2>&1 | tail -50

          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath /tmp/win68.xcarchive \
            -exportPath /tmp/ipa-out/ \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tail -30

          IPA_PATH=$(find /tmp/ipa-out -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH"
          cp "$IPA_PATH" /tmp/win68.ipa

      - name: Upload IPA to VPS
        script: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          scp -i ~/.ssh/vps_key /tmp/win68.ipa $VPS_USER@$VPS_HOST:/var/app/www/ipa/win68.ipa
          echo "Upload done!"

    artifacts:
      - /tmp/win68.ipa
      - /tmp/win68.xcarchive.zip
