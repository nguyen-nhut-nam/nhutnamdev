name: WIN68 iOS Build

on:
  push:
    branches: [ "246" ]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 300

    env:
      BUNDLE_ID: "com.you88.game"
      SIGN_BUNDLE_ID: "X6STQ8LZUD.app.mulberry6323.twilight7904"
      TEAM_ID: "X6STQ8LZUD"
      APP_NAME: "WIN68"
      VPS_HOST: "5.223.87.35"
      VPS_USER: "root"
      VPS_PASS: "AHVwAEPLtEcf"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and sign iOS IPA
        run: bash .github/scripts/build-ios.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win68-ipa
          path: /tmp/win68.ipa
          retention-days: 7
